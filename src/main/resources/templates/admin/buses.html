<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear bus - Digitrans</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .bus-management-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
        .bus-management-form { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:end; }
        .bus-management-form .form-row { margin:0; }
        .bus-management-form > .primary { grid-column:1 / -1; }
        .bus-tools { display:flex; gap:8px; flex-wrap:wrap; }
        .bus-row { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:12px 14px; border:1px solid #eee; border-radius:9px; margin-bottom:8px; }
        .bus-badge { display:inline-block; margin-left:8px; padding:4px 8px; border-radius:999px; background:#e6f4ff; color:#1d4ed8; font-size:11px; font-weight:700; text-transform:uppercase; }
        .bus-rutas { color:#718096; font-size:13px; }
        .bus-actions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:50; padding:16px; }
        .modal-overlay.abierto { display:flex; }
        .modal-box { background:white; border-radius:12px; padding:24px; width:100%; max-width:420px; }
        .flash-ok { background:#e6fffa; color:#22543d; border:1px solid #38a169; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
        .flash-error { background:#fff5f5; color:#822727; border:1px solid #f56565; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
        @media (max-width:700px) { .bus-management-form { grid-template-columns:1fr; } .bus-row { align-items:flex-start; flex-direction:column; } }
    </style>
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body>
<div class="page">
    <main class="center-card wide">
        <section class="card">
            <header class="bus-management-header">
                <div>
                    <p class="admin-eyebrow">Digitrans · ADMINISTRACIÓN</p>
                    <h1>Crear y gestionar buses</h1>
                    <p class="admin-home-subtitle">Registra buses y configura las rutas que pueden operar.</p>
                </div>
                <a th:href="@{/admin/horarios}" class="btn-pagina">← Menú de horarios</a>
            </header>

            <p th:if="${mensaje}" class="flash-ok" th:text="${mensaje}" role="status"></p>
            <p th:if="${error}" class="flash-error" th:text="${error}" role="alert"></p>

            <h2>Registrar bus</h2>
            <form class="bus-management-form" th:action="@{/admin/horarios/buses/crear}" method="post">
                <div class="form-row">
                    <label for="placa">Número del bus</label>
                    <input id="placa" type="text" name="placa" placeholder="Ej.: B-210" required>
                </div>
                <div class="form-row">
                    <label for="tipo">Tipo de servicio</label>
                    <select id="tipo" name="tipo" required>
                        <option value="TRONCAL">Troncal</option>
                        <option value="PETRONCAL">Petroncal</option>
                        <option value="ALIMENTADOR">Alimentador</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="rutas">Rutas (separadas por coma)</label>
                    <input id="rutas" type="text" name="rutas" placeholder="Ej.: T100E, X101, A104">
                </div>
                <button type="submit" class="primary">Guardar bus</button>
            </form>

            <hr style="margin:26px 0; border:0; border-top:1px solid #eee;">

            <div class="bus-management-header">
                <h2>Buses registrados</h2>
                <form class="bus-tools" th:action="@{/admin/horarios/buses}" method="get">
                    <input type="search" name="buscarBus" th:value="${buscarBus}" placeholder="Buscar por número...">
                    <select name="tipoBus">
                        <option value="">Todos los tipos</option>
                        <option value="TRONCAL" th:selected="${tipoBusSeleccionado == 'TRONCAL'}">Troncal</option>
                        <option value="PETRONCAL" th:selected="${tipoBusSeleccionado == 'PETRONCAL'}">Petroncal</option>
                        <option value="ALIMENTADOR" th:selected="${tipoBusSeleccionado == 'ALIMENTADOR'}">Alimentador</option>
                    </select>
                    <button type="submit" class="btn-buscar">Filtrar</button>
                    <a th:href="@{/admin/horarios/buses}" class="btn-cancelar">Limpiar</a>
                </form>
            </div>

            <p th:if="${#lists.isEmpty(busesRegistrados)}" class="admin-empty-state">
                No hay buses que coincidan con los filtros.
            </p>
            <article th:each="b : ${busesRegistrados}" class="bus-row">
                <div>
                    🚌 <strong th:text="${b.placa}">B-210</strong>
                    <span class="bus-badge" th:text="${b.tipo != null ? b.tipo : 'TRONCAL'}">TRONCAL</span>
                    <p class="bus-rutas"
                       th:text="${b.rutas == null or #lists.isEmpty(b.rutas) ? 'Sin rutas configuradas' : #lists.size(b.rutas) + ' rutas: ' + #strings.listJoin(b.rutas, ', ')}">Rutas</p>
                </div>
                <div class="bus-actions">
                    <button type="button" class="btn-secundario edit-bus-button"
                            th:attr="data-id=${b.id},data-placa=${b.placa},data-rutas=${b.rutas == null ? '' : #strings.listJoin(b.rutas, ', ')},data-tipo=${b.tipo != null ? b.tipo : 'TRONCAL'}">
                        ✏️ Editar
                    </button>
                    <form th:action="@{/admin/horarios/buses/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${b.id}">
                        <button type="submit" class="btn-eliminar-horario" title="Eliminar bus"
                                onclick="return confirm('¿Eliminar este bus? Se quitará de los conductores asignados y se desactivarán sus horarios pendientes o en curso. El historial se conservará.')">🗑️</button>
                    </form>
                </div>
            </article>

            <nav th:if="${totalBusPages > 1}" class="pagination-bar" aria-label="Paginación de buses">
                <a th:if="${currentBusPage > 0}"
                   th:href="@{/admin/horarios/buses(busPage=${currentBusPage - 1},buscarBus=${buscarBus},tipoBus=${tipoBusSeleccionado})}"
                   class="btn-pagina">Anterior</a>
                <span class="pagina-info" th:text="|Página ${currentBusPage + 1} de ${totalBusPages}|"></span>
                <a th:if="${currentBusPage + 1 < totalBusPages}"
                   th:href="@{/admin/horarios/buses(busPage=${currentBusPage + 1},buscarBus=${buscarBus},tipoBus=${tipoBusSeleccionado})}"
                   class="btn-pagina">Siguiente</a>
            </nav>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modalEditarBus" role="dialog" aria-modal="true" aria-labelledby="editarBusTitulo">
    <div class="modal-box">
        <h2 id="editarBusTitulo">Editar bus</h2>
        <form th:action="@{/admin/horarios/buses/editar}" method="post">
            <input type="hidden" name="id" id="editarBusId">
            <div class="form-row">
                <label for="editarBusPlaca">Número del bus</label>
                <input type="text" name="placa" id="editarBusPlaca" required>
            </div>
            <div class="form-row">
                <label for="editarBusTipo">Tipo de servicio</label>
                <select name="tipo" id="editarBusTipo" required>
                    <option value="TRONCAL">Troncal</option>
                    <option value="PETRONCAL">Petroncal</option>
                    <option value="ALIMENTADOR">Alimentador</option>
                </select>
            </div>
            <div class="form-row">
                <label for="editarBusRutas">Rutas (separadas por coma)</label>
                <input type="text" name="rutas" id="editarBusRutas">
            </div>
            <div class="bus-tools" style="margin-top:16px;">
                <button type="submit" class="primary">Guardar cambios</button>
                <button type="button" class="ghost" id="cancelarEditarBus">Cancelar</button>
            </div>
        </form>
    </div>
</div>
<script>
    const modalEditarBus = document.getElementById('modalEditarBus');
    document.querySelectorAll('.edit-bus-button').forEach((button) => {
      button.addEventListener('click', () => {
        document.getElementById('editarBusId').value = button.dataset.id;
        document.getElementById('editarBusPlaca').value = button.dataset.placa;
        document.getElementById('editarBusRutas').value = button.dataset.rutas;
        document.getElementById('editarBusTipo').value = button.dataset.tipo;
        modalEditarBus.classList.add('abierto');
      });
    });
    document.getElementById('cancelarEditarBus').addEventListener('click', () => {
      modalEditarBus.classList.remove('abierto');
    });
</script>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
