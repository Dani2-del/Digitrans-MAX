<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Digitrans</title>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" href="/Transcaribe_APP/src/main/resources/static/style.css">
    <style>
        .center-card { width: 95%; max-width: 1400px !important; }
        .wide { max-width: 1400px !important; }
        .card-select {
            padding: 6px; border-radius: 8px; border: 1px solid #ddd;
            background-color: #fff; font-family: inherit; cursor: pointer;
            width: 100%; min-width: 150px;
        }
        .saldo-display { font-weight: bold; color: #2e7d32; white-space: nowrap; }
        .admin-table th { text-align: left; padding: 12px; }
        .role-badge {
            font-size: 11px; padding: 2px 6px; border-radius: 4px;
            background: #eee; color: #666; display: block; margin-top: 4px;
        }
        .btn-excel {
            background-color: #28a745; color: white; padding: 10px 18px;
            border-radius: 8px; text-decoration: none; font-weight: bold;
            font-size: 14px; display: flex; align-items: center; gap: 8px;
            border: none; cursor: pointer; transition: background 0.3s;
        }
        .btn-excel:hover { background-color: #218838; }
        .btn-graficas {
            background-color: #f09454; color: white; padding: 10px 18px;
            border-radius: 8px; text-decoration: none; font-weight: bold;
            font-size: 14px; display: flex; align-items: center; gap: 8px;
            border: none; cursor: pointer; transition: background 0.3s;
        }
        .btn-graficas:hover { background-color: #d67d3e; }
        .btn-usuario {
            background: white; color: #f09454; border: 2px solid #f09454;
            border-radius: 50px; padding: 10px 20px; font-size: 14px;
            font-weight: bold; text-decoration: none; display: flex;
            align-items: center; gap: 8px; transition: background 0.2s;
            cursor: pointer;
        }
        .btn-usuario:hover { background: #fff3e0; }
        .excel-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); align-items: center;
            justify-content: center; z-index: 1000;
        }
        .excel-modal-box {
            background: white; padding: 28px; border-radius: 16px;
            width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .excel-modal-box h3 { color: #f09454; margin: 0 0 6px 0; }
        .excel-modal-box p { color: #718096; font-size: 0.9rem; margin: 0 0 20px 0; }
        .filter-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .filter-row { display: flex; flex-direction: column; gap: 4px; }
        .filter-row label { font-size: 0.85rem; font-weight: 600; color: #4a5568; }
        .filter-row select, .filter-row input {
            padding: 10px 12px; border-radius: 10px;
            border: 1px solid rgba(240,148,84,0.3);
            background: white; color: #1a1a1a; font-size: 0.95rem;
        }
        .filter-row select:focus, .filter-row input:focus {
            outline: none; border-color: #f09454;
            box-shadow: 0 0 0 3px rgba(240,148,84,0.15);
        }
        .excel-modal-actions { display: flex; gap: 10px; }
        .btn-descargar {
            flex: 1; background: #28a745; color: white; border: none;
            padding: 12px; border-radius: 10px; font-weight: 700;
            font-size: 0.95rem; cursor: pointer; transition: background 0.2s;
        }
        .btn-descargar:hover { background: #218838; }
        .btn-cancelar {
            flex: 1; background: transparent; color: #f09454;
            border: 1px solid #f09454; padding: 12px; border-radius: 10px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cancelar:hover { background: rgba(240,148,84,0.05); }
        .granularity-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(240,148,84,0.3);
            background: white; color: #4a5568; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-size: 0.88rem;
        }
        .tab-btn.active { background: #f09454; color: white; border-color: #f09454; }
    </style>
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>

<body>
<div class="page">
    <div class="center-card wide" style="max-width: 1400px; width: 95%;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h2 style="margin: 0;">Panel administrador</h2>
                    <p style="margin: 0;">Usuarios registrados:</p>
                </div>

                <div style="display: flex; gap: 12px; align-items: center;">

                    <!-- Botón volver a vista usuario -->
                    <a href="/menu" class="btn-usuario">
                        👤 Vista Usuario
                    </a>

                    <button class="btn-excel" onclick="abrirModalExcel()">
                        📊 Descargar Reporte Excel
                    </button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre / Rol</th>
                        <th>Correo</th>
                        <th>Tarjetas</th>
                        <th>Saldo</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td>
                            <span th:text="${u.nombre != null ? u.nombre : '-'}"></span>
                            <small class="role-badge" th:text="${u.role}"></small>
                        </td>
                        <td th:text="${u.correo}"></td>
                        <td>
                            <select class="card-select" onchange="updateSaldoDisplay(this)">
                                <option value="" data-saldo="0">Elegir tarjeta...</option>
                                <option th:each="t : ${u.tarjetas}"
                                        th:value="${t.numeroTarjeta}"
                                        th:data-saldo="${t.saldo}"
                                        th:text="${t.numeroTarjeta}">
                                </option>
                            </select>
                        </td>
                        <td class="saldo-display">$0</td>
                        <td>
                            <button class="card-btn" th:attr="data-id=${u.id}" onclick="openChargeModal(this)">Cobrar</button>
                            <button class="card-btn"
                                    th:attr="data-id=${u.id}, data-nombre=${u.nombre}, data-correo=${u.correo}, data-role=${u.role}, data-bus=${u.busAsignado}"
                                    onclick="openEditModal(this)">Editar</button>
                            <button class="card-btn2" th:if="${u.role != 'ROLE_ADMIN'}"
                                    th:attr="data-id=${u.id}" onclick="deleteUser(this)">Eliminar</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <button onclick="window.location.href='/'" class="ghost">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal Excel -->
<div id="excelModal" class="excel-modal-overlay">
    <div class="excel-modal-box">
        <h3>📊 Descargar Reporte</h3>
        <p>Selecciona el período que quieres exportar</p>

        <div class="granularity-tabs">
            <button class="tab-btn active" onclick="setGranularity('anual', this)">Por Año</button>
            <button class="tab-btn" onclick="setGranularity('mensual', this)">Por Mes</button>
            <button class="tab-btn" onclick="setGranularity('diario', this)">Por Día</button>
            <button class="tab-btn" onclick="setGranularity('todo', this)">Todo</button>
        </div>

        <div class="filter-group">
            <div class="filter-row" id="rowAnio">
                <label>Año</label>
                <select id="filtroAnio"></select>
            </div>
            <div class="filter-row" id="rowMes" style="display:none;">
                <label>Mes</label>
                <select id="filtroMes">
                    <option value="1">Enero</option> <option value="2">Febrero</option>
                    <option value="3">Marzo</option> <option value="4">Abril</option>
                    <option value="5">Mayo</option> <option value="6">Junio</option>
                    <option value="7">Julio</option> <option value="8">Agosto</option>
                    <option value="9">Septiembre</option> <option value="10">Octubre</option>
                    <option value="11">Noviembre</option> <option value="12">Diciembre</option>
                </select>
            </div>
            <div class="filter-row" id="rowDia" style="display:none;">
                <label>Día</label>
                <input type="number" id="filtroDia" min="1" max="31" value="1" />
            </div>
        </div>

        <div class="excel-modal-actions">
            <button class="btn-descargar" onclick="descargarExcel()">⬇️ Descargar</button>
            <button class="btn-cancelar" onclick="cerrarModalExcel()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Cobrar -->
<div id="chargeModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index: 1000;">
    <div style="background:white;padding:20px;border-radius:12px;width:420px;">
        <h3>Cobrar pasaje</h3>
        <p>Monto: <strong>3500</strong></p>
        <input type="hidden" id="modalUserId" />
        <button onclick="submitCharge()" class="primary">Confirmar</button>
        <button onclick="closeModal()" class="ghost">Cancelar</button>
        <div id="modalMsg"></div>
    </div>
</div>

<!-- Modal Editar -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index: 1000;">
    <div style="background:white;padding:25px;border-radius:12px;width:420px; position:relative;">
        <button onclick="closeEditModal()" style="position:absolute; top:10px; right:15px; border:none; background:none; font-size:20px; cursor:pointer;">✖</button>
        <h3>Editar usuario</h3>
        <input type="hidden" id="editUserId" />
        <label style="font-size:13px;color:#666;">Nombre completo:</label>
        <input type="text" id="editNombre" style="width:100%;padding:8px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;"><br>
        <label style="font-size:13px;color:#666;">Correo electrónico:</label>
        <input type="email" id="editCorreo" style="width:100%;padding:8px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;"><br>
        <label style="font-size:13px;color:#666;">Rol asignado:</label>
        <select id="editRole" onchange="toggleBusRow()" style="width:100%;padding:8px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;">
            <option value="ROLE_USER">Usuario (ROLE_USER)</option>
            <option value="ROLE_ADMIN">Administrador (ROLE_ADMIN)</option>
            <option value="ROLE_CONDUCTOR">Conductor (ROLE_CONDUCTOR)</option>
        </select>

        <div id="rowBusAsignado" style="display:none;">
            <label style="font-size:13px;color:#666;">Bus asignado:</label>
            <select id="editBus" style="width:100%;padding:8px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;">
                <option value="">Sin bus asignado</option>
                <option th:each="b : ${buses}" th:value="${b.id}" th:text="${b.placa}"></option>
            </select>
        </div>

        <label style="font-size:13px;color:#666;">Seguridad:</label>
        <input type="password" id="editPassword" placeholder="Nueva contraseña (dejar en blanco)" style="width:100%;padding:8px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;">
        <div style="display:flex;gap:10px;">
            <button type="button" onclick="submitEdit()" class="primary" style="flex:1;">Guardar cambios</button>
            <button type="button" onclick="closeEditModal()" class="ghost" style="flex:1;">Cancelar</button>
        </div>
        <div id="editMsg" style="margin-top:15px;text-align:center;font-weight:bold;"></div>
    </div>
</div>

<script>
// ===== EXCEL MODAL =====
let granularidadActual = 'anual';

function abrirModalExcel() {
    const select = document.getElementById('filtroAnio');
    select.innerHTML = '';
    const anioActual = new Date().getFullYear();
    for (let y = anioActual; y >= anioActual - 5; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        select.appendChild(opt);
    }
    document.getElementById('filtroMes').value = new Date().getMonth() + 1;
    document.getElementById('filtroDia').value = new Date().getDate();
    document.getElementById('excelModal').style.display = 'flex';
}

function cerrarModalExcel() {
    document.getElementById('excelModal').style.display = 'none';
}

function setGranularity(tipo, btn) {
    granularidadActual = tipo;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('rowAnio').style.display  = tipo === 'todo' ? 'none' : 'flex';
    document.getElementById('rowMes').style.display   = (tipo === 'mensual' || tipo === 'diario') ? 'flex' : 'none';
    document.getElementById('rowDia').style.display   = tipo === 'diario' ? 'flex' : 'none';
}

function descargarExcel() {
    let url = '/admin/reporte/excel?tipo=' + granularidadActual;
    if (granularidadActual !== 'todo') url += '&anio=' + document.getElementById('filtroAnio').value;
    if (granularidadActual === 'mensual' || granularidadActual === 'diario') url += '&mes=' + document.getElementById('filtroMes').value;
    if (granularidadActual === 'diario') url += '&dia=' + document.getElementById('filtroDia').value;
    window.transcaribeDownloadFile(url);
    cerrarModalExcel();
}

// ===== TABLA =====
function updateSaldoDisplay(selectElement) {
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const saldo = selectedOption.getAttribute('data-saldo');
    const row = selectElement.closest('tr');
    const saldoCell = row.querySelector('.saldo-display');
    if (saldo && selectElement.value !== "") {
        saldoCell.textContent = new Number(saldo).toLocaleString('es-CO', {style:'currency', currency:'COP', minimumFractionDigits:0});
    } else {
        saldoCell.textContent = "$0";
    }
}

// ===== MODALES =====
const modal = document.getElementById('chargeModal');
const editModal = document.getElementById('editModal');

function openChargeModal(btn) { document.getElementById('modalUserId').value = btn.getAttribute('data-id'); modal.style.display = 'flex'; }
function closeModal() { modal.style.display = 'none'; }

function submitCharge() {
    const userId = document.getElementById('modalUserId').value;
    const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') ?? "";
    const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') ?? "";
    const headers = {'Content-Type':'application/x-www-form-urlencoded'};
    if (header && token) headers[header] = token;
    fetch('/admin/charge', {method:'POST', headers, body: new URLSearchParams({userId, amount:3500})})
        .then(r => r.json()).then(res => { if(res.status==='ok') location.reload(); });
}

function toggleBusRow() {
    const esConductor = document.getElementById('editRole').value === 'ROLE_CONDUCTOR';
    document.getElementById('rowBusAsignado').style.display = esConductor ? 'block' : 'none';
}

function openEditModal(btn) {
    document.getElementById('editUserId').value = btn.getAttribute('data-id');
    document.getElementById('editNombre').value = btn.getAttribute('data-nombre');
    document.getElementById('editCorreo').value = btn.getAttribute('data-correo');
    document.getElementById('editRole').value = btn.getAttribute('data-role');
    document.getElementById('editBus').value = btn.getAttribute('data-bus') || '';
    document.getElementById('editPassword').value = '';
    document.getElementById('editMsg').textContent = '';
    toggleBusRow();
    editModal.style.display = 'flex';
}
function closeEditModal() { editModal.style.display = 'none'; }

function submitEdit() {
    const userId = document.getElementById('editUserId').value;
    const nombre = document.getElementById('editNombre').value;
    const correo = document.getElementById('editCorreo').value;
    const role = document.getElementById('editRole').value;
    const password = document.getElementById('editPassword').value;
    const busAsignado = document.getElementById('editBus').value;
    const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') ?? "";
    const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') ?? "";
    const headers = {'Content-Type':'application/x-www-form-urlencoded'};
    if (header && token) headers[header] = token;
    fetch('/admin/editUser', {method:'POST', headers, body: new URLSearchParams({userId, nombre, correo, role, password, busAsignado})})
        .then(r => r.json()).then(res => {
            if(res.status==='ok') {
                document.getElementById('editMsg').style.color = "green";
                document.getElementById('editMsg').textContent = "Usuario actualizado ✅";
                setTimeout(() => location.reload(), 1000);
            }
        });
}

function deleteUser(btn) {
    if(!confirm("¿Está seguro de que desea eliminar este usuario?")) return;
    const userId = btn.getAttribute('data-id');
    const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') ?? "";
    const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') ?? "";
    const headers = {'Content-Type':'application/x-www-form-urlencoded'};
    if (header && token) headers[header] = token;
    fetch('/admin/deleteUser', {method:'POST', headers, body: new URLSearchParams({userId})})
        .then(r => r.json()).then(res => { if(res.status==='ok') location.reload(); });
}
</script>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
