<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
    <meta charset="UTF-8">
    <title>Verificar Registro - Digitrans</title>
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body>
    <div class="page">
        <main class="center-card">
            <div class="card">
                <h1 class="title">Verifica tu correo</h1>
                
                <p class="info-text">
                    Ingresa el código de 6 dígitos que enviamos a:<br>
                    <strong th:text="${correo}">usuario@correo.com</strong>
                </p>

                <form th:action="@{/verificar-otp}" method="post" class="form">
                    <input type="hidden" 
                           th:if="${_csrf}" 
                           th:name="${_csrf.parameterName}" 
                           th:value="${_csrf.token}" />

                    <input type="hidden" name="correo" th:value="${correo}" />

                    <input type="text" 
                           name="codigo" 
                           placeholder="000000" 
                           class="otp-input" 
                           maxlength="6" 
                           required 
                           pattern="\d{6}" 
                           title="Deben ser 6 números"
                           autocomplete="off" />

                    <button class="primary" type="submit">Confirmar Registro</button>
                </form>

                <div class="row small">
                    <span>¿No te llegó?</span>
                </div>

                <form th:action="@{/verificar-otp/reenviar}" method="post" class="form resend-code-form">
                    <input type="hidden"
                           th:if="${_csrf}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />
                    <input type="hidden" name="correoActual" th:value="${correo}" />
                    <label for="correoNuevo">Corrige tu correo si es necesario y te enviaremos otro código:</label>
                    <input type="email"
                           id="correoNuevo"
                           name="correoNuevo"
                           th:value="${correoNuevo != null ? correoNuevo : correo}"
                           autocomplete="email"
                           required />
                    <button type="submit" class="link-button">Volver a intentar y reenviar código</button>
                </form>

                <p class="success" th:if="${mensaje}" th:text="${mensaje}" style="margin-top: 15px;"></p>
                <p class="error" th:if="${error}" th:text="${error}" style="margin-top: 15px;"></p>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
