<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Digitrans</title>
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body class="login-page">
    <div class="page">
    <main class="center-card">
            <div class="card">
                <div class="recovery-icon">🔑</div>
                <h1 class="title">¿Olvidaste tu clave?</h1>
                
                <p class="info-text">
                    No te preocupes. Ingresa tu correo electrónico y te enviaremos un 
                    <strong>código de seguridad</strong> para restablecer tu cuenta de Digitrans.
                </p>

                <form th:action="@{/olvido-password}" method="post" class="form">
                    <!-- Token CSRF para seguridad en Spring Security -->

                    <label for="correo">Correo Electrónico</label>
                    <input type="email" 
                           id="correo"
                           name="correo" 
                           placeholder="ejemplo@correo.com" 
                           required 
                           autocomplete="email" />

                    <button class="primary" type="submit">Enviar Código</button>
                </form>

                <a th:href="@{/login}" class="back-to-login">← Volver al inicio de sesión</a>

                <!-- Alertas de error si el correo no existe -->
                <div class="messages" style="margin-top: 20px;">
                    <p class="error" th:if="${error}" th:text="${error}" 
                       style="color: #d93025; background: #fce8e6; padding: 10px; border-radius: 4px; text-align: center; font-size: 0.85em;">
                    </p>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
