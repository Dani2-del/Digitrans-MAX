<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
  <meta charset="UTF-8" />
  <title>Rutas Favoritas - Digitrans</title>
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card">
      <div class="card" style="max-width: 600px;">
        <h2 style="margin-bottom: 20px;">Rutas Favoritas</h2>
        <form method="get" th:action="@{/rutas}" style="display:flex; gap:8px; margin-bottom:16px;">
            <input type="search" name="buscar" th:value="${buscar}" placeholder="Buscar ruta..."
                   style="flex:1; padding:10px; border:1px solid #ccd6d9; border-radius:8px;">
            <button class="primary" type="submit">Buscar</button>
        </form>

        <div th:if="${not #lists.isEmpty(rutasFavoritasConPreferencia)}">
            <div th:each="preferencia : ${rutasFavoritasConPreferencia}" class="ruta-slim">
                <div class="ruta-favorite-heading">
                    <span class="ruta-nombre" th:text="'🚌 ' + ${preferencia.ruta}"></span>
                    <form th:action="@{/rutas/favorito/eliminar}" method="post" style="display:inline;">
                        <input type="hidden" name="ruta" th:value="${preferencia.ruta}" />
                        <button type="submit" class="btn-icon" title="Quitar de favoritos"
                                onclick="return confirm('¿Quitar esta ruta de tus favoritas?')">🗑️</button>
                    </form>
                </div>
                <form th:action="@{/rutas/favorito/notificaciones}" method="post" class="route-notification-form">
                    <input type="hidden" name="ruta" th:value="${preferencia.ruta}" />
                    <label class="route-notification-toggle">
                        <input type="checkbox" name="notificacionesActivas" value="true"
                               th:checked="${preferencia.notificacionesActivas}" />
                        Notificarme cuando inicie un bus de esta ruta
                    </label>
                    <div class="route-notification-hours">
                        <label>
                            Desde
                            <input type="time" name="horaDesde" required
                                   th:value="${preferencia.horaDesde}" />
                        </label>
                        <label>
                            Hasta
                            <input type="time" name="horaHasta" required
                                   th:value="${preferencia.horaHasta}" />
                        </label>
                        <button type="submit" class="primary">Guardar horario</button>
                    </div>
                    <small>Solo recibirás correos si el horario programado del bus inicia dentro de esta franja.</small>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(rutasFavoritasConPreferencia)}" class="error-message">
          <p>Aún no tienes rutas favoritas.</p>
        </div>

        <div class="add-section">
            <h4 style="margin-bottom: 10px;">Agregar ruta a favoritos</h4>
            <form th:action="@{/rutas/favorito/agregar}" method="post" style="display: flex; gap: 10px;">
                <select name="ruta" class="select-ruta" required>
                    <option value="" disabled selected>Selecciona una ruta de Digitrans...</option>
                    <option th:each="r : ${rutasDisponibles}"
                            th:value="${r}"
                            th:text="${r}">
                    </option>
                </select>
                <button type="submit" class="primary" style="padding: 8px 20px; white-space: nowrap;">Agregar</button>
            </form>
        </div>
        <div th:if="${totalPages > 1}" style="display:flex; justify-content:center; gap:12px; margin-top:18px;">
            <a th:if="${currentPage > 0}" th:href="@{/rutas(page=${currentPage - 1}, buscar=${buscar})}">Anterior</a>
            <span th:text="'Página ' + ${currentPage + 1} + ' de ' + ${totalPages}"></span>
            <a th:if="${currentPage + 1 < totalPages}" th:href="@{/rutas(page=${currentPage + 1}, buscar=${buscar})}">Siguiente</a>
        </div>

        <div class="row" style="margin-top: 30px;">
          <button class="ghost" th:onclick="|window.location.href='@{/menu}'|">Menú</button>
        </div>

        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
